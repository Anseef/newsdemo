name: Daily South Indian Education News Scraper

on:
  schedule:
    # Runs automatically every day at 02:00 UTC (7:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows you to trigger it manually with a button click in GitHub!

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Required Python Libraries
        run: pip install requests beautifulsoup4 lxml

      - name: Execute Scraper Script
        run: python scraper.py

      - name: Commit and Push Updates to Codebase
        run: |
          git config --global user.name 'Vidyabhyasam NewsBot'
          git config --global user.email 'bot@vidyabhyasam.portal'
          git add src/data/NewsData.json
          git commit -m "auto-update: daily south indian education updates [skip ci]" || echo "No new updates found today."
          git push